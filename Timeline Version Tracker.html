<div class="container mt-4">  
    <div id="loadingMessage" class="message">Loading data, please wait...</div>
    <div id="noDataMessage" class="message" style="display: none;">No data found.</div>
    
    <div class="table-container" id="tableContainer" style="display: none;">
        <table class="custom-table" id="projectTable">
            <thead>
                <tr id="tableHeaders">
                    <th rowspan='2' class='round-left'>Project</th>
                    <th rowspan='2'>Milestone</th>
                    <th colspan="2">Current Schedule</th>
                </tr>
                <tr id="subHeaders">                       
                    <th>Start Date</th>
                    <th>Due Date</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
